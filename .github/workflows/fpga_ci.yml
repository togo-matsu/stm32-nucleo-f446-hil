name: FPGA Hardware CI/CD (Tang Nano 9K)

on:
  push:
    paths:
      - 'firmware/fpga_tangnano9k/**'
      - '.github/workflows/fpga_ci.yml'
  workflow_dispatch:

jobs:
  # 1. クラウド側: 高速自動論理合成
  build-bitstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          version: '2024-07-01'
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Synthesize RTL (Yosys)
        working-directory: firmware/fpga_tangnano9k/src
        run: |
          yosys -p "read_verilog blinky.v; synth_gowin -top blinky -json blinky.json"

      - name: Place and Route (nextpnr-gowin)
        working-directory: firmware/fpga_tangnano9k/src
        run: |
          nextpnr-gowin \
            --json blinky.json \
            --write blinky_pnr.json \
            --device GW1NR-LV9QN88PC6/I5 \
            --family GW1N-9C \
            --cst tangnano9k.cst

      - name: Generate Bitstream (gowin_pack)
        working-directory: firmware/fpga_tangnano9k/src
        run: |
          gowin_pack -d GW1N-9C -o blinky.fs blinky_pnr.json
          sha256sum blinky.fs > blinky.fs.sha256

      - name: Upload Bitstream Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tangnano9k-bitstream
          path: |
            firmware/fpga_tangnano9k/src/blinky.fs
            firmware/fpga_tangnano9k/src/blinky.fs.sha256

  # 2. ローカル K8s 側: エフェメラルランナーによる Storage Gateway への配備
  deploy-to-storage-gateway:
    needs: build-bitstream
    runs-on: [self-hosted, k8s-deployer]
    steps:
      - name: Download Bitstream Artifact
        uses: actions/download-artifact@v4
        with:
          name: tangnano9k-bitstream
          path: ./artifacts

      - name: Deploy to Storage Gateway (HTTP PUT)
        run: |
          cd ./artifacts
          SHA_VAL=$(sha256sum blinky.fs | awk '{print $1}')
          echo "${SHA_VAL}  latest.fs" > latest.fs.sha256

          echo "[Deploy] Uploading bitstream to Storage Gateway..."
          curl -f -X PUT --upload-file blinky.fs http://10.0.0.200/ota/tangnano/latest.fs
          curl -f -X PUT --upload-file latest.fs.sha256 http://10.0.0.200/ota/tangnano/latest.fs.sha256
          echo "[Deploy] Successfully uploaded to Storage Gateway!"
