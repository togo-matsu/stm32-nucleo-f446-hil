[package]
name = "nucleo_f446_app"
version = "0.1.0"
edition = "2021"

[dependencies]
embassy-executor  = { version = "0.7", features = ["task-arena-size-32768", "arch-cortex-m", "executor-thread", "defmt"] }
embassy-time      = { version = "0.4", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-stm32     = { version = "0.2", features = ["defmt", "stm32f446re", "time-driver-any", "exti", "memory-x"] }
embedded-io-async = { version = "0.6", default-features = false }

cortex-m          = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt       = "0.7"
defmt             = "0.3"
defmt-rtt         = "0.4"
panic-probe       = { version = "0.3", features = ["print-defmt"] }

[profile.release]
opt-level = "s"
lto = true
